# backend/docker-compose.yml  ->  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: fitness_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword     # must match MYSQL_PASSWORD in .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: fitness_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---- dashboards (development only) ----
  # MySQL dashboard  -> http://localhost:8080
  adminer:
    image: adminer
    container_name: fitness_adminer
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8080:8080"     # 127.0.0.1 = only reachable from your own PC

  # MongoDB dashboard -> http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: fitness_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  mysql_data:
  mongo_data: